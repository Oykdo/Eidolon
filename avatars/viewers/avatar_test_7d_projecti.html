<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar 3D - 7D Projection | Poly-Spinor Nexus 7D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a1a2a 100%);
            font-family: 'Segoe UI', 'Consolas', monospace;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; position: relative; }
        #canvas-container { width: 100%; height: 100%; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 30, 0.9);
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 20px;
            min-width: 300px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px #ffd70044;
        }
        #info-panel h1 {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #ffd700;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .info-label { color: #777; font-size: 0.9em; }
        .info-value { color: #28fef5; font-weight: bold; }
        .rarity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: #ffd70033;
            border: 1px solid #ffd700;
            color: #ffd700;
            font-size: 0.85em;
            text-shadow: 0 0 8px #ffd700;
        }
        .dna-code {
            font-family: monospace;
            font-size: 0.7em;
            color: #5388dd;
            word-break: break-all;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            margin-top: 10px;
        }
        
        #power-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd70055 0%, transparent 70%);
            border: 3px solid #ffd700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px #ffd70066;
        }
        #power-indicator .power-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffd700;
        }
        #power-indicator .power-label {
            font-size: 0.7em;
            color: #888;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }
        .control-btn {
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: #ffd70033;
            box-shadow: 0 0 20px #ffd70055;
        }
        .control-btn.active {
            background: #ffd700;
            color: #000;
        }
        
        #unique-params {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #5388dd;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.75em;
        }
        #unique-params h3 {
            color: #5388dd;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .param-row {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
        }
        .param-name { color: #666; }
        .param-val { color: #2c3bcd; font-family: monospace; }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 1.5em;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 5px #ffd700, 0 0 10px #ffd700; }
            to { text-shadow: 0 0 15px #ffd700, 0 0 25px #ffd700; }
        }
        .glow { animation: glow 2s ease-in-out infinite alternate; }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="info-panel">
            <h1 class="glow">🎭 AVATAR UNIQUE</h1>
            <div class="info-row">
                <span class="info-label">Type</span>
                <span class="info-value">7D Projection</span>
            </div>
            <div class="info-row">
                <span class="info-label">Rarete</span>
                <span class="rarity-badge">LEGENDARY</span>
            </div>
            <div class="info-row">
                <span class="info-label">Score</span>
                <span class="info-value">85.0/100</span>
            </div>
            <div class="info-row">
                <span class="info-label">Puissance</span>
                <span class="info-value">15,000</span>
            </div>
            <div class="dna-code">DNA: test_7d_projection_12345...</div>
        </div>
        
        <div id="power-indicator">
            <span class="power-value">15K</span>
            <span class="power-label">POWER</span>
        </div>
        
        <div id="unique-params">
            <h3>⚙️ PARAMETRES UNIQUES</h3>
            <div class="param-row"><span class="param-name">Scale</span><span class="param-val">1.15x0.70x1.17</span></div>
            <div class="param-row"><span class="param-name">Metalness</span><span class="param-val">0.38</span></div>
            <div class="param-row"><span class="param-name">IOR</span><span class="param-val">2.14</span></div>
            <div class="param-row"><span class="param-name">Particles</span><span class="param-val">135</span></div>
            <div class="param-row"><span class="param-name">Complexity</span><span class="param-val">1.8x</span></div>
        </div>
        
        <div id="controls">
            <button class="control-btn active" onclick="toggleRotation()">⟳ Auto-Rotate</button>
            <button class="control-btn" onclick="resetCamera()">⌖ Reset</button>
            <button class="control-btn" onclick="toggleWireframe()">◇ Wireframe</button>
            <button class="control-btn" onclick="screenshot()">📷 Screenshot</button>
        </div>
        
        <div id="loading">Chargement de l'avatar unique...</div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let autoRotate = true;
        let wireframeMode = false;
        const animationCallbacks = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.08);
            
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3.5, 2.5, 3.5);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 0.8;
            controls.minDistance = 2;
            controls.maxDistance = 12;
            
            // Eclairage avance
            const ambientLight = new THREE.AmbientLight(0x404050, 0.4);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(5, 8, 5);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight('#ffd700', 0.6);
            fillLight.position.set(-5, 2, -5);
            scene.add(fillLight);
            
            const backLight = new THREE.DirectionalLight('#28fef5', 0.4);
            backLight.position.set(0, -5, -3);
            scene.add(backLight);
            
            const rimLight = new THREE.DirectionalLight('#5388dd', 0.3);
            rimLight.position.set(3, 0, -5);
            scene.add(rimLight);
            
            // Grille de sol
            const gridHelper = new THREE.GridHelper(12, 24, '#ffd700', 0x222244);
            gridHelper.position.y = -2;
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
            
            // Creer la geometrie unique de l'avatar
            
            // === 7D PROJECTION UNIQUE ===
            const mainGroup = new THREE.Group();
            mainGroup.scale.set(1.151, 0.704, 1.168);
            scene.add(mainGroup);
            
            const dimCount = 7;
            const layers = [];
            
            for (let d = 0; d < dimCount; d++) {
                const layerGroup = new THREE.Group();
                const hue = d / dimCount;
                const color = new THREE.Color().setHSL(hue, 0.8, 0.5);
                
                // Heptagone unique par dimension
                const points = [];
                const r = 1.3 - d * 0.12 + -0.016 * Math.sin(d);
                for (let i = 0; i < 7; i++) {
                    const angle = (i / 7) * Math.PI * 2 + d * 0.144;
                    points.push(new THREE.Vector3(
                        Math.cos(angle) * r,
                        Math.sin(angle) * r,
                        0
                    ));
                }
                points.push(points[0].clone());
                
                const lineGeom = new THREE.BufferGeometry().setFromPoints(points);
                const lineMat = new THREE.LineBasicMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.85 - d * 0.08
                });
                const line = new THREE.Line(lineGeom, lineMat);
                layerGroup.add(line);
                
                // Noeuds aux sommets
                for (let i = 0; i < 7; i++) {
                    const nodeGeom = new THREE.IcosahedronGeometry(0.06 - d * 0.005, 0);
                    const nodeMat = new THREE.MeshBasicMaterial({ color: color });
                    const node = new THREE.Mesh(nodeGeom, nodeMat);
                    node.position.copy(points[i]);
                    layerGroup.add(node);
                }
                
                // Lignes vers le centre
                for (let i = 0; i < 7; i++) {
                    const centerPoints = [points[i], new THREE.Vector3(0, 0, 0)];
                    const centerGeom = new THREE.BufferGeometry().setFromPoints(centerPoints);
                    const centerMat = new THREE.LineBasicMaterial({
                        color: '#7883df',
                        transparent: true,
                        opacity: 0.25
                    });
                    layerGroup.add(new THREE.Line(centerGeom, centerMat));
                }
                
                layerGroup.position.z = d * 0.18 - 0.6;
                layerGroup.rotation.z = d * 0.12 + 0.044;
                mainGroup.add(layerGroup);
                layers.push(layerGroup);
                
                animationCallbacks.push((time) => {
                    layerGroup.rotation.z = d * 0.12 + 0.044 + time * 0.959 * (0.15 + d * 0.05);
                    layerGroup.position.z = (d * 0.18 - 0.6) + Math.sin(time * 1.62 + d * 0.5) * 0.08;
                });
            }
            
            // Centre 7D
            const centerGeom = new THREE.DodecahedronGeometry(0.12, 0);
            const centerMat = new THREE.MeshPhysicalMaterial({
                color: '#ffd700',
                emissive: '#ffd700',
                emissiveIntensity: 0.246,
                metalness: 0.380,
                roughness: 0.291
            });
            const center = new THREE.Mesh(centerGeom, centerMat);
            mainGroup.add(center);
            
            const centerLight = new THREE.PointLight('#ffd700', 2, 4);
            mainGroup.add(centerLight);
            
            animationCallbacks.push((time) => {
                center.rotation.x = time * 0.959 * 0.5;
                center.rotation.y = time * 0.959 * 0.7;
                center.scale.setScalar(1 + Math.sin(time * 1.62) * 0.15);
            });
            
            
            
        
            
            document.getElementById('loading').style.display = 'none';
            window.addEventListener('resize', onWindowResize);
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            animationCallbacks.forEach(cb => cb(time));
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function toggleRotation() {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            event.target.classList.toggle('active', autoRotate);
        }
        
        function resetCamera() {
            camera.position.set(3.5, 2.5, 3.5);
            controls.target.set(0, 0, 0);
            controls.update();
        }
        
        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            scene.traverse((child) => {
                if (child.isMesh && child.material && !child.material.isShaderMaterial) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => m.wireframe = wireframeMode);
                    } else {
                        child.material.wireframe = wireframeMode;
                    }
                }
            });
            event.target.classList.toggle('active', wireframeMode);
        }
        
        function screenshot() {
            renderer.render(scene, camera);
            const link = document.createElement('a');
            link.download = 'avatar_3d_test_7d_.png';
            link.href = renderer.domElement.toDataURL('image/png');
            link.click();
        }
        
        init();
    </script>
</body>
</html>
