<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar 3D - Nexus Crystal | Poly-Spinor Nexus 7D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a1a2a 100%);
            font-family: 'Segoe UI', 'Consolas', monospace;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; position: relative; }
        #canvas-container { width: 100%; height: 100%; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 30, 0.9);
            border: 1px solid #00ffff;
            border-radius: 12px;
            padding: 20px;
            min-width: 300px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px #00ffff44;
        }
        #info-panel h1 {
            color: #00ffff;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #00ffff;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .info-label { color: #777; font-size: 0.9em; }
        .info-value { color: #3efd23; font-weight: bold; }
        .rarity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: #00ffff33;
            border: 1px solid #00ffff;
            color: #00ffff;
            font-size: 0.85em;
            text-shadow: 0 0 8px #00ffff;
        }
        .dna-code {
            font-family: monospace;
            font-size: 0.7em;
            color: #69dda7;
            word-break: break-all;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            margin-top: 10px;
        }
        
        #power-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #00ffff55 0%, transparent 70%);
            border: 3px solid #00ffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px #00ffff66;
        }
        #power-indicator .power-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #00ffff;
        }
        #power-indicator .power-label {
            font-size: 0.7em;
            color: #888;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }
        .control-btn {
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: #00ffff33;
            box-shadow: 0 0 20px #00ffff55;
        }
        .control-btn.active {
            background: #00ffff;
            color: #000;
        }
        
        #unique-params {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #69dda7;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.75em;
        }
        #unique-params h3 {
            color: #69dda7;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .param-row {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
        }
        .param-name { color: #666; }
        .param-val { color: #1a27df; font-family: monospace; }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 1.5em;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 5px #00ffff, 0 0 10px #00ffff; }
            to { text-shadow: 0 0 15px #00ffff, 0 0 25px #00ffff; }
        }
        .glow { animation: glow 2s ease-in-out infinite alternate; }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="info-panel">
            <h1 class="glow">🎭 AVATAR UNIQUE</h1>
            <div class="info-row">
                <span class="info-label">Type</span>
                <span class="info-value">Nexus Crystal</span>
            </div>
            <div class="info-row">
                <span class="info-label">Rarete</span>
                <span class="rarity-badge">PRIMORDIAL</span>
            </div>
            <div class="info-row">
                <span class="info-label">Score</span>
                <span class="info-value">100.0/100</span>
            </div>
            <div class="info-row">
                <span class="info-label">Puissance</span>
                <span class="info-value">15,000</span>
            </div>
            <div class="dna-code">DNA: 9e6c9d2508fc37b4...</div>
        </div>
        
        <div id="power-indicator">
            <span class="power-value">15K</span>
            <span class="power-label">POWER</span>
        </div>
        
        <div id="unique-params">
            <h3>⚙️ PARAMETRES UNIQUES</h3>
            <div class="param-row"><span class="param-name">Scale</span><span class="param-val">1.21x1.20x1.05</span></div>
            <div class="param-row"><span class="param-name">Metalness</span><span class="param-val">0.26</span></div>
            <div class="param-row"><span class="param-name">IOR</span><span class="param-val">2.42</span></div>
            <div class="param-row"><span class="param-name">Particles</span><span class="param-val">64</span></div>
            <div class="param-row"><span class="param-name">Complexity</span><span class="param-val">2.5x</span></div>
        </div>
        
        <div id="controls">
            <button class="control-btn active" onclick="toggleRotation()">⟳ Auto-Rotate</button>
            <button class="control-btn" onclick="resetCamera()">⌖ Reset</button>
            <button class="control-btn" onclick="toggleWireframe()">◇ Wireframe</button>
            <button class="control-btn" onclick="screenshot()">📷 Screenshot</button>
        </div>
        
        <div id="loading">Chargement de l'avatar unique...</div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        let scene, camera, renderer, controls;
        let autoRotate = true;
        let wireframeMode = false;
        const animationCallbacks = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.08);
            
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3.5, 2.5, 3.5);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 0.8;
            controls.minDistance = 2;
            controls.maxDistance = 12;
            
            // Eclairage avance
            const ambientLight = new THREE.AmbientLight(0x404050, 0.4);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(5, 8, 5);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight('#00ffff', 0.6);
            fillLight.position.set(-5, 2, -5);
            scene.add(fillLight);
            
            const backLight = new THREE.DirectionalLight('#3efd23', 0.4);
            backLight.position.set(0, -5, -3);
            scene.add(backLight);
            
            const rimLight = new THREE.DirectionalLight('#69dda7', 0.3);
            rimLight.position.set(3, 0, -5);
            scene.add(rimLight);
            
            // Grille de sol
            const gridHelper = new THREE.GridHelper(12, 24, '#00ffff', 0x222244);
            gridHelper.position.y = -2;
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
            
            // Creer la geometrie unique de l'avatar
            
            // === NEXUS CRYSTAL UNIQUE ===
            const mainGroup = new THREE.Group();
            mainGroup.scale.set(1.213, 1.806, 1.054);
            scene.add(mainGroup);
            
            // Cristal principal (octaedre deforme)
            const crystalGeom = new THREE.OctahedronGeometry(1, 0);
            const crystalPos = crystalGeom.attributes.position;
            for (let i = 0; i < crystalPos.count; i++) {
                const y = crystalPos.getY(i);
                const stretch = 1 + -0.129 * Math.abs(y);
                crystalPos.setY(i, y * (1.5 + stretch));
            }
            crystalGeom.computeVertexNormals();
            
            const crystalMat = new THREE.MeshPhysicalMaterial({
                color: '#00ffff',
                metalness: 0.05,
                roughness: 0.02,
                transparent: true,
                opacity: 0.8,
                emissive: '#66ffff',
                emissiveIntensity: 0.462,
                clearcoat: 1.0,
                clearcoatRoughness: 0.0,
                reflectivity: 1.0,
                ior: 2.420,
                transmission: 0.3
            });
            const crystal = new THREE.Mesh(crystalGeom, crystalMat);
            mainGroup.add(crystal);
            
            // Cristaux satellites uniques
            for (let i = 0; i < 10; i++) {
                const angle = (i / 10) * Math.PI * 2;
                const smallGeom = new THREE.OctahedronGeometry(0.2 + Math.random() * 0.15, 0);
                smallGeom.scale(1, 1.3 + -0.030, 1);
                
                const smallMat = new THREE.MeshPhysicalMaterial({
                    color: i % 2 === 0 ? '#3efd23' : '#69dda7',
                    metalness: 0.1,
                    roughness: 0.1,
                    transparent: true,
                    opacity: 0.75,
                    emissive: i % 2 === 0 ? '#3efd23' : '#69dda7',
                    emissiveIntensity: 0.3
                });
                const small = new THREE.Mesh(smallGeom, smallMat);
                small.position.set(
                    Math.cos(angle) * 1.4,
                    Math.sin(angle * 2 + 2.637) * 0.3,
                    Math.sin(angle) * 1.4
                );
                small.rotation.set(angle, angle * 0.5, 0);
                mainGroup.add(small);
                
                animationCallbacks.push((time) => {
                    small.position.y = Math.sin(time * 1.01 + i) * 0.25;
                    small.rotation.y = time * 1.433 * 0.5;
                    small.rotation.z = time * 1.433 * 0.3;
                });
            }
            
            // Rayons de lumiere internes
            for (let i = 0; i < 6; i++) {
                const rayGeom = new THREE.CylinderGeometry(0.008, 0.008, 2.5, 8);
                const rayMat = new THREE.MeshBasicMaterial({
                    color: '#dfda84',
                    transparent: true,
                    opacity: 0.4
                });
                const ray = new THREE.Mesh(rayGeom, rayMat);
                ray.rotation.z = (i / 6) * Math.PI;
                ray.rotation.x = Math.PI / 2;
                mainGroup.add(ray);
            }
            
            // Lumiere centrale
            const crystalLight = new THREE.PointLight('#00ffff', 3, 8);
            mainGroup.add(crystalLight);
            
            animationCallbacks.push((time) => {
                crystal.rotation.y = time * 1.433 * 0.3;
                crystal.position.y = Math.sin(time * 1.01) * 0.08;
                crystalLight.intensity = 2.5 + Math.sin(time * 1.01) * 0.5;
            });
            
            
            
            // Particules orbitales uniques
            const particleCount = 64;
            const particleGeom = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const orbits = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 1.5 + Math.random() * 1.0;
                
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
                
                const colorChoice = Math.random();
                let color;
                if (colorChoice < 0.33) color = new THREE.Color('#3efd23');
                else if (colorChoice < 0.66) color = new THREE.Color('#69dda7');
                else color = new THREE.Color('#1a27df');
                
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                
                sizes[i] = 0.02 + Math.random() * 0.06;
                orbits[i * 3] = r;
                orbits[i * 3 + 1] = 0.2 + Math.random() * 0.67;
                orbits[i * 3 + 2] = Math.random() * Math.PI * 2;
            }
            
            particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            particleGeom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            const particleMat = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const particles = new THREE.Points(particleGeom, particleMat);
            scene.add(particles);
            
            animationCallbacks.push((time) => {
                const pos = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const r = orbits[i * 3];
                    const speed = orbits[i * 3 + 1];
                    const phase = orbits[i * 3 + 2];
                    const angle = time * speed + phase;
                    
                    pos[i * 3] = r * Math.cos(angle) * Math.cos(phase);
                    pos[i * 3 + 1] = r * Math.sin(angle * 0.7) * 0.5;
                    pos[i * 3 + 2] = r * Math.sin(angle) * Math.sin(phase);
                }
                particles.geometry.attributes.position.needsUpdate = true;
                particles.rotation.y = time * 0.1;
            });
        
        
            
            document.getElementById('loading').style.display = 'none';
            window.addEventListener('resize', onWindowResize);
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            animationCallbacks.forEach(cb => cb(time));
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        window.resetCamera = function() {
            camera.position.set(3.5, 2.5, 3.5);
            controls.target.set(0, 0, 0);
            controls.update();
        };
        
        window.toggleWireframe = function() {
            wireframeMode = !wireframeMode;
            scene.traverse((child) => {
                if (child.isMesh && child.material && !child.material.isShaderMaterial) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => m.wireframe = wireframeMode);
                    } else {
                        child.material.wireframe = wireframeMode;
                    }
                }
            });
            event.target.classList.toggle('active', wireframeMode);
        };
        
        window.screenshot = function() {
            renderer.render(scene, camera);
            const link = document.createElement('a');
            link.download = 'avatar_3d_9e6c9d25.png';
            link.href = renderer.domElement.toDataURL('image/png');
            link.click();
        };
        
        window.toggleRotation = function() {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            event.target.classList.toggle('active', autoRotate);
        };
        
        init();
    </script>
</body>
</html>
