<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar 3D - Spinor Torus | Poly-Spinor Nexus 7D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a1a2a 100%);
            font-family: 'Segoe UI', 'Consolas', monospace;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; position: relative; }
        #canvas-container { width: 100%; height: 100%; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 30, 0.9);
            border: 1px solid #ffd700;
            border-radius: 12px;
            padding: 20px;
            min-width: 300px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px #ffd70044;
        }
        #info-panel h1 {
            color: #ffd700;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #ffd700;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .info-label { color: #777; font-size: 0.9em; }
        .info-value { color: #2b166f; font-weight: bold; }
        .rarity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: #ffd70033;
            border: 1px solid #ffd700;
            color: #ffd700;
            font-size: 0.85em;
            text-shadow: 0 0 8px #ffd700;
        }
        .dna-code {
            font-family: monospace;
            font-size: 0.7em;
            color: #803007;
            word-break: break-all;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            margin-top: 10px;
        }
        
        #power-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd70055 0%, transparent 70%);
            border: 3px solid #ffd700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px #ffd70066;
        }
        #power-indicator .power-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #ffd700;
        }
        #power-indicator .power-label {
            font-size: 0.7em;
            color: #888;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }
        .control-btn {
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #ffd700;
            color: #ffd700;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: #ffd70033;
            box-shadow: 0 0 20px #ffd70055;
        }
        .control-btn.active {
            background: #ffd700;
            color: #000;
        }
        
        #unique-params {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #803007;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.75em;
        }
        #unique-params h3 {
            color: #803007;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .param-row {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
        }
        .param-name { color: #666; }
        .param-val { color: #9dbb45; font-family: monospace; }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd700;
            font-size: 1.5em;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 5px #ffd700, 0 0 10px #ffd700; }
            to { text-shadow: 0 0 15px #ffd700, 0 0 25px #ffd700; }
        }
        .glow { animation: glow 2s ease-in-out infinite alternate; }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="info-panel">
            <h1 class="glow">🎭 AVATAR UNIQUE</h1>
            <div class="info-row">
                <span class="info-label">Type</span>
                <span class="info-value">Spinor Torus</span>
            </div>
            <div class="info-row">
                <span class="info-label">Rarete</span>
                <span class="rarity-badge">LEGENDARY</span>
            </div>
            <div class="info-row">
                <span class="info-label">Score</span>
                <span class="info-value">85.0/100</span>
            </div>
            <div class="info-row">
                <span class="info-label">Puissance</span>
                <span class="info-value">15,000</span>
            </div>
            <div class="dna-code">DNA: test_spinor_torus_12345...</div>
        </div>
        
        <div id="power-indicator">
            <span class="power-value">15K</span>
            <span class="power-label">POWER</span>
        </div>
        
        <div id="unique-params">
            <h3>⚙️ PARAMETRES UNIQUES</h3>
            <div class="param-row"><span class="param-name">Scale</span><span class="param-val">1.04x0.98x1.12</span></div>
            <div class="param-row"><span class="param-name">Metalness</span><span class="param-val">0.12</span></div>
            <div class="param-row"><span class="param-name">IOR</span><span class="param-val">2.22</span></div>
            <div class="param-row"><span class="param-name">Particles</span><span class="param-val">73</span></div>
            <div class="param-row"><span class="param-name">Complexity</span><span class="param-val">1.8x</span></div>
        </div>
        
        <div id="controls">
            <button class="control-btn active" onclick="toggleRotation()">⟳ Auto-Rotate</button>
            <button class="control-btn" onclick="resetCamera()">⌖ Reset</button>
            <button class="control-btn" onclick="toggleWireframe()">◇ Wireframe</button>
            <button class="control-btn" onclick="screenshot()">📷 Screenshot</button>
        </div>
        
        <div id="loading">Chargement de l'avatar unique...</div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let autoRotate = true;
        let wireframeMode = false;
        const animationCallbacks = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.08);
            
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3.5, 2.5, 3.5);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 0.8;
            controls.minDistance = 2;
            controls.maxDistance = 12;
            
            // Eclairage avance
            const ambientLight = new THREE.AmbientLight(0x404050, 0.4);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(5, 8, 5);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight('#ffd700', 0.6);
            fillLight.position.set(-5, 2, -5);
            scene.add(fillLight);
            
            const backLight = new THREE.DirectionalLight('#2b166f', 0.4);
            backLight.position.set(0, -5, -3);
            scene.add(backLight);
            
            const rimLight = new THREE.DirectionalLight('#803007', 0.3);
            rimLight.position.set(3, 0, -5);
            scene.add(rimLight);
            
            // Grille de sol
            const gridHelper = new THREE.GridHelper(12, 24, '#ffd700', 0x222244);
            gridHelper.position.y = -2;
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
            
            // Creer la geometrie unique de l'avatar
            
            // === SPINOR TORUS UNIQUE ===
            const mainGroup = new THREE.Group();
            mainGroup.scale.set(1.039, 0.975, 1.116);
            scene.add(mainGroup);
            
            // Tore principal deforme
            const torusGeom = new THREE.TorusGeometry(1, 0.35, 32, 100);
            const torusPos = torusGeom.attributes.position;
            for (let i = 0; i < torusPos.count; i++) {
                const x = torusPos.getX(i);
                const y = torusPos.getY(i);
                const z = torusPos.getZ(i);
                const angle = Math.atan2(z, x);
                const wave = 0.290 * Math.sin(angle * 3.6);
                torusPos.setXYZ(i, x * (1 + wave), y, z * (1 + wave));
            }
            torusGeom.computeVertexNormals();
            
            
            const torusMat = new THREE.MeshPhysicalMaterial({
                color: '#ffd700',
                metalness: 0.115,
                roughness: 0.074,
                transparent: true,
                opacity: 0.623,
                emissive: '#ffe766',
                emissiveIntensity: 0.237,
                clearcoat: 0.900,
                clearcoatRoughness: 0.037,
                reflectivity: 0.926,
                ior: 2.222
            });
        
            const torus = new THREE.Mesh(torusGeom, torusMat);
            mainGroup.add(torus);
            
            // Tores internes (flux spinoriel)
            for (let i = 0; i < 3; i++) {
                const innerGeom = new THREE.TorusGeometry(0.85 - i * 0.15, 0.04, 16, 50);
                const innerMat = new THREE.MeshBasicMaterial({
                    color: ['#2b166f', '#803007', '#9dbb45'][i],
                    transparent: true,
                    opacity: 0.7 - i * 0.15
                });
                const inner = new THREE.Mesh(innerGeom, innerMat);
                inner.rotation.x = i * 0.3 + 4.541;
                mainGroup.add(inner);
                
                animationCallbacks.push((time) => {
                    inner.rotation.z = time * 1.438 * (1 + i * 0.5);
                });
            }
            
            // Lignes de flux energetiques
            const fluxCount = 17;
            for (let i = 0; i < fluxCount; i++) {
                const angle = (i / fluxCount) * Math.PI * 2;
                const curve = new THREE.CatmullRomCurve3([
                    new THREE.Vector3(Math.cos(angle) * 1.4, 0, Math.sin(angle) * 1.4),
                    new THREE.Vector3(Math.cos(angle) * 0.7, 0.4 + 0.038, Math.sin(angle) * 0.7),
                    new THREE.Vector3(Math.cos(angle + 0.3) * 1.4, 0, Math.sin(angle + 0.3) * 1.4)
                ]);
                const tubeGeom = new THREE.TubeGeometry(curve, 20, 0.015, 8, false);
                const tubeMat = new THREE.MeshBasicMaterial({
                    color: '#9dbb45',
                    transparent: true,
                    opacity: 0.5
                });
                const tube = new THREE.Mesh(tubeGeom, tubeMat);
                mainGroup.add(tube);
            }
            
            // Points de flux
            for (let i = 0; i < 8; i++) {
                const a = (i / 8) * Math.PI * 2;
                const pGeom = new THREE.SphereGeometry(0.05, 16, 16);
                const pMat = new THREE.MeshBasicMaterial({ color: '#23b0ae' });
                const p = new THREE.Mesh(pGeom, pMat);
                p.position.set(Math.cos(a) * 1.35, 0, Math.sin(a) * 1.35);
                mainGroup.add(p);
                
                animationCallbacks.push((time) => {
                    const newA = a + time * 0.986;
                    p.position.set(Math.cos(newA) * 1.35, Math.sin(time * 2 + i) * 0.1, Math.sin(newA) * 1.35);
                    p.scale.setScalar(1 + Math.sin(time * 3 + i) * 0.3);
                });
            }
            
            animationCallbacks.push((time) => {
                torus.rotation.x = Math.sin(time * 1.438 * 0.5) * 0.2;
                torus.rotation.y = time * 1.438 * 0.2;
            });
            
            
            
            // Particules orbitales uniques
            const particleCount = 73;
            const particleGeom = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const orbits = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 1.5 + Math.random() * 1.0;
                
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
                
                const colorChoice = Math.random();
                let color;
                if (colorChoice < 0.33) color = new THREE.Color('#2b166f');
                else if (colorChoice < 0.66) color = new THREE.Color('#803007');
                else color = new THREE.Color('#9dbb45');
                
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                
                sizes[i] = 0.02 + Math.random() * 0.06;
                orbits[i * 3] = r;
                orbits[i * 3 + 1] = 0.2 + Math.random() * 0.99;
                orbits[i * 3 + 2] = Math.random() * Math.PI * 2;
            }
            
            particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            particleGeom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            const particleMat = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const particles = new THREE.Points(particleGeom, particleMat);
            scene.add(particles);
            
            animationCallbacks.push((time) => {
                const pos = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const r = orbits[i * 3];
                    const speed = orbits[i * 3 + 1];
                    const phase = orbits[i * 3 + 2];
                    const angle = time * speed + phase;
                    
                    pos[i * 3] = r * Math.cos(angle) * Math.cos(phase);
                    pos[i * 3 + 1] = r * Math.sin(angle * 0.7) * 0.5;
                    pos[i * 3 + 2] = r * Math.sin(angle) * Math.sin(phase);
                }
                particles.geometry.attributes.position.needsUpdate = true;
                particles.rotation.y = time * 0.1;
            });
        
        
            
            document.getElementById('loading').style.display = 'none';
            window.addEventListener('resize', onWindowResize);
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            animationCallbacks.forEach(cb => cb(time));
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function toggleRotation() {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            event.target.classList.toggle('active', autoRotate);
        }
        
        function resetCamera() {
            camera.position.set(3.5, 2.5, 3.5);
            controls.target.set(0, 0, 0);
            controls.update();
        }
        
        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            scene.traverse((child) => {
                if (child.isMesh && child.material && !child.material.isShaderMaterial) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => m.wireframe = wireframeMode);
                    } else {
                        child.material.wireframe = wireframeMode;
                    }
                }
            });
            event.target.classList.toggle('active', wireframeMode);
        }
        
        function screenshot() {
            renderer.render(scene, camera);
            const link = document.createElement('a');
            link.download = 'avatar_3d_test_spi.png';
            link.href = renderer.domElement.toDataURL('image/png');
            link.click();
        }
        
        init();
    </script>
</body>
</html>
