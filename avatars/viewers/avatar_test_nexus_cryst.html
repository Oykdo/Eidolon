<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar 3D - Nexus Crystal | Poly-Spinor Nexus 7D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a15 50%, #050508 100%);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; position: relative; }
        #canvas-container { width: 100%; height: 100%; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(135deg, rgba(10,10,30,0.95) 0%, rgba(20,10,40,0.9) 100%);
            border: 1px solid #ff00ff66;
            border-radius: 16px;
            padding: 24px;
            min-width: 320px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 60px #ff00ff22, inset 0 1px 0 rgba(255,255,255,0.05);
        }
        #info-panel h1 {
            color: #ff00ff;
            font-size: 1.4em;
            margin-bottom: 18px;
            text-shadow: 0 0 20px #ff00ff88;
            letter-spacing: 2px;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .info-label { color: #666; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        .info-value { color: #da9a89; font-weight: 600; font-size: 1.05em; }
        .rarity-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ff00ff44 0%, #ff00ff22 100%);
            border: 1px solid #ff00ff88;
            color: #ff00ff;
            font-size: 0.85em;
            font-weight: 600;
            text-shadow: 0 0 10px #ff00ff;
            letter-spacing: 1px;
        }
        .dna-code {
            font-family: 'Consolas', monospace;
            font-size: 0.7em;
            color: #97e13a;
            word-break: break-all;
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        #power-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #ff00ff44 0%, transparent 60%);
            border: 3px solid #ff00ff88;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px #ff00ff44, inset 0 0 20px #ff00ff22;
        }
        #power-indicator .power-value {
            font-size: 1.6em;
            font-weight: 700;
            color: #ff00ff;
            text-shadow: 0 0 15px #ff00ff;
        }
        #power-indicator .power-label {
            font-size: 0.7em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        #controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }
        .control-btn {
            background: linear-gradient(135deg, rgba(10,10,30,0.9) 0%, rgba(20,15,40,0.85) 100%);
            border: 1px solid #ff00ff66;
            color: #ff00ff;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.95em;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
        }
        .control-btn:hover {
            background: linear-gradient(135deg, #ff00ff33 0%, #ff00ff22 100%);
            box-shadow: 0 0 25px #ff00ff44;
            transform: translateY(-2px);
        }
        .control-btn.active {
            background: linear-gradient(135deg, #ff00ff 0%, #ff00ffcc 100%);
            color: #000;
            font-weight: 600;
        }
        
        #unique-params {
            position: absolute;
            bottom: 90px;
            right: 20px;
            background: linear-gradient(135deg, rgba(10,10,30,0.9) 0%, rgba(15,10,35,0.85) 100%);
            border: 1px solid #97e13a44;
            border-radius: 12px;
            padding: 16px;
            font-size: 0.8em;
            backdrop-filter: blur(10px);
        }
        #unique-params h3 {
            color: #97e13a;
            margin-bottom: 12px;
            font-size: 0.95em;
            letter-spacing: 1px;
        }
        .param-row { display: flex; justify-content: space-between; margin: 5px 0; gap: 20px; }
        .param-name { color: #555; }
        .param-val { color: #fbf017; font-family: 'Consolas', monospace; font-weight: 600; }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff00ff;
            font-size: 1.3em;
            text-shadow: 0 0 20px #ff00ff;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff88; }
            50% { text-shadow: 0 0 20px #ff00ff, 0 0 40px #ff00ff, 0 0 60px #ff00ff66; }
        }
        .glow { animation: glow 3s ease-in-out infinite; }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="info-panel">
            <h1 class="glow">✦ AVATAR UNIQUE</h1>
            <div class="info-row">
                <span class="info-label">Type</span>
                <span class="info-value">Nexus Crystal</span>
            </div>
            <div class="info-row">
                <span class="info-label">Rarete</span>
                <span class="rarity-badge">MYTHICAL</span>
            </div>
            <div class="info-row">
                <span class="info-label">Score</span>
                <span class="info-value">90.0/100</span>
            </div>
            <div class="info-row">
                <span class="info-label">Puissance</span>
                <span class="info-value">25,000</span>
            </div>
            <div class="dna-code">DNA: test_nexus_crystal_v2_premium...</div>
        </div>
        
        <div id="power-indicator">
            <span class="power-value">25K</span>
            <span class="power-label">Power</span>
        </div>
        
        <div id="unique-params">
            <h3>⚙ PARAMETRES</h3>
            <div class="param-row"><span class="param-name">Scale</span><span class="param-val">0.85×1.13×0.83</span></div>
            <div class="param-row"><span class="param-name">Metalness</span><span class="param-val">0.36</span></div>
            <div class="param-row"><span class="param-name">IOR</span><span class="param-val">1.84</span></div>
            <div class="param-row"><span class="param-name">Iridescence</span><span class="param-val">0.73</span></div>
            <div class="param-row"><span class="param-name">Complexity</span><span class="param-val">2.8×</span></div>
        </div>
        
        <div id="controls">
            <button class="control-btn active" onclick="toggleRotation()">⟳ Rotation</button>
            <button class="control-btn" onclick="resetCamera()">⌖ Reset</button>
            <button class="control-btn" onclick="toggleWireframe()">◇ Wireframe</button>
            <button class="control-btn" onclick="screenshot()">📷 Capture</button>
        </div>
        
        <div id="loading">Chargement...</div>
    </div>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        let scene, camera, renderer, controls;
        let autoRotate = true;
        let wireframeMode = false;
        const animationCallbacks = [];
        
        function init() {
            // Scene avec brouillard
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050508);
            scene.fog = new THREE.FogExp2(0x050508, 0.06);
            
            // Camera
            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(4, 3, 4);
            
            // Renderer haute qualite
            renderer = new THREE.WebGLRenderer({ 
                antialias: true, 
                alpha: true,
                powerPreference: "high-performance"
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.4;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // Controles
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.04;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 0.6;
            controls.minDistance = 2.5;
            controls.maxDistance = 15;
            controls.maxPolarAngle = Math.PI * 0.85;
            
            // === ECLAIRAGE CINEMATOGRAPHIQUE ===
            const ambientLight = new THREE.AmbientLight(0x202030, 0.4);
            scene.add(ambientLight);
            
            // Key light
            const keyLight = new THREE.DirectionalLight(0xffffff, 1.5);
            keyLight.position.set(5, 8, 5);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.width = 2048;
            keyLight.shadow.mapSize.height = 2048;
            scene.add(keyLight);
            
            // Fill light (couleur primaire)
            const fillLight = new THREE.DirectionalLight('#ff00ff', 0.8);
            fillLight.position.set(-5, 3, -3);
            scene.add(fillLight);
            
            // Back light (accent)
            const backLight = new THREE.DirectionalLight('#da9a89', 0.5);
            backLight.position.set(0, -3, -5);
            scene.add(backLight);
            
            // Rim light
            const rimLight = new THREE.DirectionalLight('#97e13a', 0.4);
            rimLight.position.set(4, 0, -4);
            scene.add(rimLight);
            
            // Sol avec grille
            const gridHelper = new THREE.GridHelper(15, 30, '#ff00ff', 0x151520);
            gridHelper.position.y = -2;
            gridHelper.material.opacity = 0.25;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
            
            // Cercle de sol lumineux
            const floorGeom = new THREE.RingGeometry(0.5, 3, 64);
            const floorMat = new THREE.MeshBasicMaterial({
                color: '#ff00ff',
                transparent: true,
                opacity: 0.08,
                side: THREE.DoubleSide
            });
            const floor = new THREE.Mesh(floorGeom, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.position.y = -1.99;
            scene.add(floor);
            
            // === GEOMETRIE AVATAR ===
            
            // === NEXUS CRYSTAL - Cristal Unique ===
            const mainGroup = new THREE.Group();
            mainGroup.scale.set(0.853, 1.803, 0.833);
            scene.add(mainGroup);
            
            // Cristal principal avec facettes
            const crystalPoints = [];
            crystalPoints.push(new THREE.Vector3(0, 1.2, 0));
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const r = 0.6 + 0.129 * Math.sin(i * 2);
                crystalPoints.push(new THREE.Vector3(Math.cos(angle) * r, 0.3, Math.sin(angle) * r));
            }
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + Math.PI / 6;
                const r = 0.8 + -0.105 * Math.cos(i * 3);
                crystalPoints.push(new THREE.Vector3(Math.cos(angle) * r, -0.2, Math.sin(angle) * r));
            }
            crystalPoints.push(new THREE.Vector3(0, -1.0, 0));
            
            const crystalGeom = new THREE.ConvexGeometry ? 
                new THREE.ConvexGeometry(crystalPoints) : 
                new THREE.OctahedronGeometry(1, 0);
            
            if (!THREE.ConvexGeometry) {
                crystalGeom.scale(1, 1.5, 1);
            }
            
            const crystalMat = new THREE.MeshPhysicalMaterial({
                color: '#ff00ff',
                metalness: 0.0,
                roughness: 0.0,
                transparent: true,
                opacity: 0.85,
                emissive: '#ff66ff',
                emissiveIntensity: 0.774,
                clearcoat: 1.0,
                clearcoatRoughness: 0.0,
                ior: 1.841,
                transmission: 0.5,
                thickness: 0.5,
                iridescence: 1.0,
                iridescenceIOR: 2.0,
                envMapIntensity: 2.0
            });
            const crystal = new THREE.Mesh(crystalGeom, crystalMat);
            mainGroup.add(crystal);
            
            // Cristaux satellites
            for (let i = 0; i < 27; i++) {
                const angle = (i / 27) * Math.PI * 2;
                const satGeom = new THREE.OctahedronGeometry(0.15 + Math.random() * 0.1, 0);
                satGeom.scale(1, 1.4, 1);
                const satMat = new THREE.MeshPhysicalMaterial({
                    color: i % 2 === 0 ? '#da9a89' : '#97e13a',
                    metalness: 0.0,
                    roughness: 0.0,
                    transparent: true,
                    opacity: 0.8,
                    emissive: i % 2 === 0 ? '#da9a89' : '#97e13a',
                    emissiveIntensity: 0.4,
                    transmission: 0.3
                });
                const sat = new THREE.Mesh(satGeom, satMat);
                sat.userData = { angle, baseY: Math.sin(angle * 2) * 0.3 };
                sat.position.set(Math.cos(angle) * 1.3, sat.userData.baseY, Math.sin(angle) * 1.3);
                sat.rotation.z = angle;
                mainGroup.add(sat);
                
                animationCallbacks.push((time) => {
                    sat.position.y = sat.userData.baseY + Math.sin(time * 2.36 + i) * 0.2;
                    sat.rotation.y = time * 0.852 * 0.5;
                    sat.rotation.x = Math.sin(time + i) * 0.3;
                });
            }
            
            // Lumieres internes
            const innerLight = new THREE.PointLight('#ff00ff', 4, 6);
            mainGroup.add(innerLight);
            
            const accentLight = new THREE.PointLight('#d645e9', 2, 4);
            accentLight.position.y = 0.5;
            mainGroup.add(accentLight);
            
            animationCallbacks.push((time) => {
                crystal.rotation.y = time * 0.852 * 0.25;
                crystal.position.y = Math.sin(time * 2.36) * 0.05;
                innerLight.intensity = 3 + Math.sin(time * 2.36) * 1.5;
            });
        
            // === AURA ENERGETIQUE ===
            const auraGroup = new THREE.Group();
            scene.add(auraGroup);
            
            // Sphere d'aura externe avec shader
            const auraGeom = new THREE.SphereGeometry(2.2, 64, 64);
            const auraMat = new THREE.ShaderMaterial({
                uniforms: {
                    time: { value: 0 },
                    color1: { value: new THREE.Color('#ff00ff') },
                    color2: { value: new THREE.Color('#d645e9') },
                    opacity: { value: 0.15 }
                },
                vertexShader: `
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    varying vec2 vUv;
                    void main() {
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = position;
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform float time;
                    uniform vec3 color1;
                    uniform vec3 color2;
                    uniform float opacity;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    varying vec2 vUv;
                    
                    void main() {
                        float pulse = sin(time * 2.36) * 0.5 + 0.5;
                        float fresnel = pow(1.0 - abs(dot(vNormal, vec3(0.0, 0.0, 1.0))), 2.5);
                        float wave = sin(vPosition.y * 8.0 + time * 3.0) * 0.5 + 0.5;
                        vec3 color = mix(color1, color2, wave * pulse);
                        float alpha = fresnel * opacity * (0.6 + pulse * 0.4);
                        gl_FragColor = vec4(color, alpha);
                    }
                `,
                transparent: true,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                depthWrite: false
            });
            const aura = new THREE.Mesh(auraGeom, auraMat);
            auraGroup.add(aura);
            
            // Anneaux d'energie rotatifs
            for (let i = 0; i < 3; i++) {
                const ringGeom = new THREE.TorusGeometry(1.8 + i * 0.3, 0.02, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: '#4f3f66',
                    transparent: true,
                    opacity: 0.4 - i * 0.1,
                    blending: THREE.AdditiveBlending
                });
                const ring = new THREE.Mesh(ringGeom, ringMat);
                ring.rotation.x = Math.PI / 2 + i * 0.3;
                ring.rotation.y = i * 0.5;
                auraGroup.add(ring);
                
                animationCallbacks.push((time) => {
                    ring.rotation.z = time * (0.3 + i * 0.15);
                    ring.rotation.x = Math.PI / 2 + Math.sin(time + i) * 0.2;
                });
            }
            
            animationCallbacks.push((time) => {
                auraMat.uniforms.time.value = time;
                aura.rotation.y = time * 0.05;
            });
        
            // === PARTICULES ORBITALES DYNAMIQUES ===
            const particleCount = 61;
            const particlesGeom = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const phases = new Float32Array(particleCount * 4);
            
            const colorPalette = [
                new THREE.Color('#ff00ff'),
                new THREE.Color('#da9a89'),
                new THREE.Color('#97e13a'),
                new THREE.Color('#fbf017')
            ];
            
            for (let i = 0; i < particleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 1.2 + Math.random() * 1.5;
                
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
                
                const color = colorPalette[Math.floor(Math.random() * 4)];
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                
                sizes[i] = 0.02 + Math.random() * 0.08;
                phases[i * 4] = r;
                phases[i * 4 + 1] = theta;
                phases[i * 4 + 2] = phi;
                phases[i * 4 + 3] = 0.2 + Math.random() * 0.32;
            }
            
            particlesGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particlesGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            particlesGeom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            const particlesMat = new THREE.PointsMaterial({
                size: 0.1,
                vertexColors: true,
                transparent: true,
                opacity: 0.85,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });
            
            const particles = new THREE.Points(particlesGeom, particlesMat);
            scene.add(particles);
            
            animationCallbacks.push((time) => {
                const pos = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const r = phases[i * 4];
                    const baseTheta = phases[i * 4 + 1];
                    const basePhi = phases[i * 4 + 2];
                    const speed = phases[i * 4 + 3];
                    
                    const theta = baseTheta + time * speed;
                    const phi = basePhi + Math.sin(time * speed * 0.5) * 0.3;
                    const dynamicR = r + Math.sin(time * 2 + i) * 0.1;
                    
                    pos[i * 3] = dynamicR * Math.sin(phi) * Math.cos(theta);
                    pos[i * 3 + 1] = dynamicR * Math.sin(phi) * Math.sin(theta);
                    pos[i * 3 + 2] = dynamicR * Math.cos(phi);
                }
                particles.geometry.attributes.position.needsUpdate = true;
            });
        
            // === COEUR D'ENERGIE PULSANT ===
            const coreGroup = new THREE.Group();
            scene.add(coreGroup);
            
            // Noyau central
            const coreGeom = new THREE.IcosahedronGeometry(0.2, 3);
            const coreMat = new THREE.MeshPhysicalMaterial({
                color: '#d645e9',
                emissive: '#ff00ff',
                emissiveIntensity: 1.5,
                metalness: 0.0,
                roughness: 0.0,
                transparent: true,
                opacity: 0.95,
                envMapIntensity: 2.0
            });
            const core = new THREE.Mesh(coreGeom, coreMat);
            coreGroup.add(core);
            
            // Halo interne
            const haloGeom = new THREE.SphereGeometry(0.35, 32, 32);
            const haloMat = new THREE.MeshBasicMaterial({
                color: '#ff66ff',
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide
            });
            const halo = new THREE.Mesh(haloGeom, haloMat);
            coreGroup.add(halo);
            
            // Rayons d'energie
            for (let i = 0; i < 16; i++) {
                const angle = (i / 16) * Math.PI * 2;
                const rayGeom = new THREE.CylinderGeometry(0.008, 0.002, 2.5, 8);
                const rayMat = new THREE.MeshBasicMaterial({
                    color: '#fbf017',
                    transparent: true,
                    opacity: 0.6,
                    blending: THREE.AdditiveBlending
                });
                const ray = new THREE.Mesh(rayGeom, rayMat);
                ray.position.set(Math.cos(angle) * 0.1, 0, Math.sin(angle) * 0.1);
                ray.rotation.z = Math.PI / 2;
                ray.rotation.y = angle;
                coreGroup.add(ray);
                
                animationCallbacks.push((time) => {
                    ray.scale.y = 0.5 + Math.sin(time * 3 + i) * 0.5;
                    ray.material.opacity = 0.3 + Math.sin(time * 2 + i * 0.5) * 0.3;
                });
            }
            
            // Point light central
            const coreLight = new THREE.PointLight('#ff00ff', 3, 5);
            coreGroup.add(coreLight);
            
            animationCallbacks.push((time) => {
                const pulse = 1 + Math.sin(time * 2.36) * 0.3;
                core.scale.setScalar(pulse);
                halo.scale.setScalar(pulse * 1.2);
                coreLight.intensity = 2 + Math.sin(time * 2.36) * 1.5;
                core.rotation.x = time * 0.5;
                core.rotation.y = time * 0.7;
            });
        
            // === EFFET HOLOGRAPHIQUE ===
            const holoGroup = new THREE.Group();
            scene.add(holoGroup);
            
            // Lignes de scan horizontales
            for (let i = 0; i < 20; i++) {
                const y = -1.5 + i * 0.15;
                const lineGeom = new THREE.PlaneGeometry(3, 0.003);
                const lineMat = new THREE.MeshBasicMaterial({
                    color: '#ff00ff',
                    transparent: true,
                    opacity: 0.15,
                    blending: THREE.AdditiveBlending,
                    side: THREE.DoubleSide
                });
                const line = new THREE.Mesh(lineGeom, lineMat);
                line.position.y = y;
                holoGroup.add(line);
            }
            
            // Grille hexagonale de fond
            const hexRadius = 2.5;
            const hexGeom = new THREE.CircleGeometry(hexRadius, 6);
            const hexMat = new THREE.MeshBasicMaterial({
                color: '#97e13a',
                transparent: true,
                opacity: 0.05,
                wireframe: true,
                blending: THREE.AdditiveBlending
            });
            
            for (let layer = 0; layer < 3; layer++) {
                const hex = new THREE.Mesh(hexGeom, hexMat.clone());
                hex.rotation.x = -Math.PI / 2;
                hex.position.y = -1.5 + layer * 0.5;
                hex.scale.setScalar(1 - layer * 0.2);
                holoGroup.add(hex);
            }
            
            // Data streams verticaux
            for (let i = 0; i < 8; i++) {
                const angle = (i / 8) * Math.PI * 2;
                const streamGeom = new THREE.BoxGeometry(0.02, 3, 0.02);
                const streamMat = new THREE.MeshBasicMaterial({
                    color: '#fbf017',
                    transparent: true,
                    opacity: 0.2,
                    blending: THREE.AdditiveBlending
                });
                const stream = new THREE.Mesh(streamGeom, streamMat);
                stream.position.set(Math.cos(angle) * 1.8, 0, Math.sin(angle) * 1.8);
                holoGroup.add(stream);
                
                animationCallbacks.push((time) => {
                    stream.material.opacity = 0.1 + Math.sin(time * 4 + i) * 0.15;
                    stream.scale.y = 0.8 + Math.sin(time * 2 + i * 0.5) * 0.2;
                });
            }
            
            animationCallbacks.push((time) => {
                holoGroup.rotation.y = time * 0.1;
            });
        
            
            document.getElementById('loading').style.display = 'none';
            window.addEventListener('resize', onWindowResize);
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            animationCallbacks.forEach(cb => cb(time));
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        window.toggleRotation = function() {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            event.target.classList.toggle('active', autoRotate);
        };
        
        window.resetCamera = function() {
            camera.position.set(4, 3, 4);
            controls.target.set(0, 0, 0);
            controls.update();
        };
        
        window.toggleWireframe = function() {
            wireframeMode = !wireframeMode;
            scene.traverse((child) => {
                if (child.isMesh && child.material && !child.material.isShaderMaterial) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => m.wireframe = wireframeMode);
                    } else {
                        child.material.wireframe = wireframeMode;
                    }
                }
            });
            event.target.classList.toggle('active', wireframeMode);
        };
        
        window.screenshot = function() {
            renderer.render(scene, camera);
            const link = document.createElement('a');
            link.download = 'avatar_3d_test_nex.png';
            link.href = renderer.domElement.toDataURL('image/png');
            link.click();
        };
        
        init();
    </script>
</body>
</html>
