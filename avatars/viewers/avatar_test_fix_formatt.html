<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar 3D - Quantum Sphere | Poly-Spinor Nexus 7D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2a 50%, #0a1a2a 100%);
            font-family: 'Segoe UI', 'Consolas', monospace;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container { width: 100vw; height: 100vh; position: relative; }
        #canvas-container { width: 100%; height: 100%; }
        
        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(10, 10, 30, 0.9);
            border: 1px solid #ff00ff;
            border-radius: 12px;
            padding: 20px;
            min-width: 300px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 40px #ff00ff44;
        }
        #info-panel h1 {
            color: #ff00ff;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #ff00ff;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin: 8px 0;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .info-label { color: #777; font-size: 0.9em; }
        .info-value { color: #cca6a1; font-weight: bold; }
        .rarity-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: #ff00ff33;
            border: 1px solid #ff00ff;
            color: #ff00ff;
            font-size: 0.85em;
            text-shadow: 0 0 8px #ff00ff;
        }
        .dna-code {
            font-family: monospace;
            font-size: 0.7em;
            color: #1fbebf;
            word-break: break-all;
            padding: 8px;
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
            margin-top: 10px;
        }
        
        #power-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #ff00ff55 0%, transparent 70%);
            border: 3px solid #ff00ff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px #ff00ff66;
        }
        #power-indicator .power-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #ff00ff;
        }
        #power-indicator .power-label {
            font-size: 0.7em;
            color: #888;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
        }
        .control-btn {
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #ff00ff;
            color: #ff00ff;
            padding: 12px 22px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        .control-btn:hover {
            background: #ff00ff33;
            box-shadow: 0 0 20px #ff00ff55;
        }
        .control-btn.active {
            background: #ff00ff;
            color: #000;
        }
        
        #unique-params {
            position: absolute;
            bottom: 80px;
            right: 20px;
            background: rgba(10, 10, 30, 0.85);
            border: 1px solid #1fbebf;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.75em;
        }
        #unique-params h3 {
            color: #1fbebf;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .param-row {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
        }
        .param-name { color: #666; }
        .param-val { color: #7f2d48; font-family: monospace; }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff00ff;
            font-size: 1.5em;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 5px #ff00ff, 0 0 10px #ff00ff; }
            to { text-shadow: 0 0 15px #ff00ff, 0 0 25px #ff00ff; }
        }
        .glow { animation: glow 2s ease-in-out infinite alternate; }
    </style>
</head>
<body>
    <div id="container">
        <div id="canvas-container"></div>
        
        <div id="info-panel">
            <h1 class="glow">🎭 AVATAR UNIQUE</h1>
            <div class="info-row">
                <span class="info-label">Type</span>
                <span class="info-value">Quantum Sphere</span>
            </div>
            <div class="info-row">
                <span class="info-label">Rarete</span>
                <span class="rarity-badge">MYTHICAL</span>
            </div>
            <div class="info-row">
                <span class="info-label">Score</span>
                <span class="info-value">92.5/100</span>
            </div>
            <div class="info-row">
                <span class="info-label">Puissance</span>
                <span class="info-value">25,000</span>
            </div>
            <div class="dna-code">DNA: test_fix_formatting_avatar_xyz12...</div>
        </div>
        
        <div id="power-indicator">
            <span class="power-value">25K</span>
            <span class="power-label">POWER</span>
        </div>
        
        <div id="unique-params">
            <h3>⚙️ PARAMETRES UNIQUES</h3>
            <div class="param-row"><span class="param-name">Scale</span><span class="param-val">0.97x0.96x1.26</span></div>
            <div class="param-row"><span class="param-name">Metalness</span><span class="param-val">0.50</span></div>
            <div class="param-row"><span class="param-name">IOR</span><span class="param-val">1.85</span></div>
            <div class="param-row"><span class="param-name">Particles</span><span class="param-val">44</span></div>
            <div class="param-row"><span class="param-name">Complexity</span><span class="param-val">2.0x</span></div>
        </div>
        
        <div id="controls">
            <button class="control-btn active" onclick="toggleRotation()">⟳ Auto-Rotate</button>
            <button class="control-btn" onclick="resetCamera()">⌖ Reset</button>
            <button class="control-btn" onclick="toggleWireframe()">◇ Wireframe</button>
            <button class="control-btn" onclick="screenshot()">📷 Screenshot</button>
        </div>
        
        <div id="loading">Chargement de l'avatar unique...</div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <script>
        let scene, camera, renderer, controls;
        let autoRotate = true;
        let wireframeMode = false;
        const animationCallbacks = [];
        
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a1a);
            scene.fog = new THREE.FogExp2(0x0a0a1a, 0.08);
            
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(3.5, 2.5, 3.5);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.3;
            renderer.outputEncoding = THREE.sRGBEncoding;
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = autoRotate;
            controls.autoRotateSpeed = 0.8;
            controls.minDistance = 2;
            controls.maxDistance = 12;
            
            // Eclairage avance
            const ambientLight = new THREE.AmbientLight(0x404050, 0.4);
            scene.add(ambientLight);
            
            const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
            mainLight.position.set(5, 8, 5);
            mainLight.castShadow = true;
            scene.add(mainLight);
            
            const fillLight = new THREE.DirectionalLight('#ff00ff', 0.6);
            fillLight.position.set(-5, 2, -5);
            scene.add(fillLight);
            
            const backLight = new THREE.DirectionalLight('#cca6a1', 0.4);
            backLight.position.set(0, -5, -3);
            scene.add(backLight);
            
            const rimLight = new THREE.DirectionalLight('#1fbebf', 0.3);
            rimLight.position.set(3, 0, -5);
            scene.add(rimLight);
            
            // Grille de sol
            const gridHelper = new THREE.GridHelper(12, 24, '#ff00ff', 0x222244);
            gridHelper.position.y = -2;
            gridHelper.material.opacity = 0.3;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);
            
            // Creer la geometrie unique de l'avatar
            
            // === QUANTUM SPHERE UNIQUE ===
            const mainGroup = new THREE.Group();
            mainGroup.scale.set(0.973, 0.960, 1.264);
            mainGroup.rotation.set(1.112, 2.781, 3.023);
            scene.add(mainGroup);
            
            // Sphere principale avec deformation unique
            const sphereGeom = new THREE.SphereGeometry(1, 64, 64);
            const posAttr = sphereGeom.attributes.position;
            for (let i = 0; i < posAttr.count; i++) {
                const x = posAttr.getX(i);
                const y = posAttr.getY(i);
                const z = posAttr.getZ(i);
                const dist = Math.sqrt(x*x + y*y + z*z);
                const deform = 1 + 0.170 * Math.sin(y * 1.03) 
                             + -0.079 * Math.cos(x * z * 1.03);
                posAttr.setXYZ(i, x * deform, y * deform, z * deform);
            }
            sphereGeom.computeVertexNormals();
            
            
            const sphereMat = new THREE.MeshPhysicalMaterial({
                color: '#ff00ff',
                metalness: 0.496,
                roughness: 0.390,
                transparent: true,
                opacity: 0.633,
                emissive: '#ff66ff',
                emissiveIntensity: 0.244,
                clearcoat: 0.576,
                clearcoatRoughness: 0.195,
                reflectivity: 0.610,
                ior: 1.850
            });
        
            const sphere = new THREE.Mesh(sphereGeom, sphereMat);
            mainGroup.add(sphere);
            
            // Anneaux orbitaux uniques
            for (let i = 0; i < 5; i++) {
                const ringR = 1.2 + i * 0.25;
                const ringGeom = new THREE.TorusGeometry(ringR, 0.015 + i * 0.005, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: i % 2 === 0 ? '#cca6a1' : '#1fbebf',
                    transparent: true,
                    opacity: 0.7 - i * 0.1
                });
                const ring = new THREE.Mesh(ringGeom, ringMat);
                ring.rotation.x = Math.PI / 2 + i * 0.170;
                ring.rotation.y = i * -0.079;
                mainGroup.add(ring);
                
                animationCallbacks.push((time) => {
                    ring.rotation.z = time * 0.577 * (0.5 + i * 0.2);
                });
            }
            
            // Noyau lumineux pulse
            const coreGeom = new THREE.IcosahedronGeometry(0.15, 2);
            const coreMat = new THREE.MeshBasicMaterial({
                color: '#3af516',
                transparent: true,
                opacity: 0.95
            });
            const core = new THREE.Mesh(coreGeom, coreMat);
            mainGroup.add(core);
            
            const coreLight = new THREE.PointLight('#ff00ff', 2, 5);
            mainGroup.add(coreLight);
            
            animationCallbacks.push((time) => {
                const pulse = 1 + Math.sin(time * 1.04) * 0.2;
                core.scale.setScalar(pulse);
                coreLight.intensity = 1.5 + Math.sin(time * 1.04) * 0.5;
                sphere.rotation.y = time * 0.577 * 0.3;
            });
            
            
            
            // Particules orbitales uniques
            const particleCount = 44;
            const particleGeom = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const orbits = new Float32Array(particleCount * 3);
            
            for (let i = 0; i < particleCount; i++) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 1.5 + Math.random() * 1.0;
                
                positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                positions[i * 3 + 2] = r * Math.cos(phi);
                
                const colorChoice = Math.random();
                let color;
                if (colorChoice < 0.33) color = new THREE.Color('#cca6a1');
                else if (colorChoice < 0.66) color = new THREE.Color('#1fbebf');
                else color = new THREE.Color('#7f2d48');
                
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
                
                sizes[i] = 0.02 + Math.random() * 0.06;
                orbits[i * 3] = r;
                orbits[i * 3 + 1] = 0.2 + Math.random() * 0.24;
                orbits[i * 3 + 2] = Math.random() * Math.PI * 2;
            }
            
            particleGeom.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            particleGeom.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            const particleMat = new THREE.PointsMaterial({
                size: 0.08,
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            const particles = new THREE.Points(particleGeom, particleMat);
            scene.add(particles);
            
            animationCallbacks.push((time) => {
                const pos = particles.geometry.attributes.position.array;
                for (let i = 0; i < particleCount; i++) {
                    const r = orbits[i * 3];
                    const speed = orbits[i * 3 + 1];
                    const phase = orbits[i * 3 + 2];
                    const angle = time * speed + phase;
                    
                    pos[i * 3] = r * Math.cos(angle) * Math.cos(phase);
                    pos[i * 3 + 1] = r * Math.sin(angle * 0.7) * 0.5;
                    pos[i * 3 + 2] = r * Math.sin(angle) * Math.sin(phase);
                }
                particles.geometry.attributes.position.needsUpdate = true;
                particles.rotation.y = time * 0.1;
            });
        
        
            
            document.getElementById('loading').style.display = 'none';
            window.addEventListener('resize', onWindowResize);
            animate();
        }
        
        function animate() {
            requestAnimationFrame(animate);
            const time = performance.now() * 0.001;
            animationCallbacks.forEach(cb => cb(time));
            controls.update();
            renderer.render(scene, camera);
        }
        
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
        
        function toggleRotation() {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
            event.target.classList.toggle('active', autoRotate);
        }
        
        function resetCamera() {
            camera.position.set(3.5, 2.5, 3.5);
            controls.target.set(0, 0, 0);
            controls.update();
        }
        
        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            scene.traverse((child) => {
                if (child.isMesh && child.material && !child.material.isShaderMaterial) {
                    if (Array.isArray(child.material)) {
                        child.material.forEach(m => m.wireframe = wireframeMode);
                    } else {
                        child.material.wireframe = wireframeMode;
                    }
                }
            });
            event.target.classList.toggle('active', wireframeMode);
        }
        
        function screenshot() {
            renderer.render(scene, camera);
            const link = document.createElement('a');
            link.download = 'avatar_3d_test_fix.png';
            link.href = renderer.domElement.toDataURL('image/png');
            link.click();
        }
        
        init();
    </script>
</body>
</html>
