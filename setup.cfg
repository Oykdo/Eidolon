# =============================================================================
# Eidolon - Setup Configuration
# =============================================================================

[metadata]
name = poly-spinor-nexus-7d
version = attr: core.__version__
description = Secure vault system with post-quantum cryptography and blockchain monitoring
long_description = file: README.md
long_description_content_type = text/markdown
author = Poly-Spinor Team
author_email = contact@polyspinor.io
license = MIT
license_files = LICENSE
url = https://github.com/polyspinor/nexus-7d
project_urls =
    Documentation = https://polyspinor.github.io/nexus-7d
    Source = https://github.com/polyspinor/nexus-7d
    Tracker = https://github.com/polyspinor/nexus-7d/issues
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Environment :: X11 Applications
    Intended Audience :: Developers
    Intended Audience :: Financial and Insurance Industry
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Security :: Cryptography
    Topic :: Office/Business :: Financial
keywords =
    vault
    cryptocurrency
    nft
    blockchain
    security
    post-quantum
    cryptography
    monitoring
    escrow

[options]
packages = find:
python_requires = >=3.9
install_requires =
    cryptography>=41.0.0
    numpy>=1.24.0
    web3>=6.0.0
    eth-account>=0.10.0
    requests>=2.31.0
    pillow>=10.0.0
include_package_data = True
zip_safe = False

[options.packages.find]
exclude =
    tests*
    docs*

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    pytest-asyncio>=0.21.0
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.1.0
    mypy>=1.5.0
    pre-commit>=3.4.0
    bandit>=1.7.0
blender =
    bpy>=3.6.0
full =
    aiohttp>=3.8.0
    prometheus-client>=0.17.0
    redis>=4.6.0
docs =
    sphinx>=7.0.0
    sphinx-rtd-theme>=1.3.0

[options.entry_points]
console_scripts =
    vault-monitor = ui.vault_monitor:main
    vault-launcher = scripts.vault_launcher:main
    vault-cli = scripts.vault_launcher:main
gui_scripts =
    vault-gui = launch_vault_monitor:main

[options.package_data]
config = *.json, *.yaml
vault_storage = *.py

# =============================================================================
# Tool Configurations
# =============================================================================

[flake8]
max-line-length = 100
extend-ignore = E203, E501, W503
exclude =
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .venv,
    venv,
    .tox,
    .mypy_cache
per-file-ignores =
    __init__.py: F401, F403
    tests/*: S101

[isort]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
skip = .git,__pycache__,.venv,build,dist

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True
exclude = tests/|build/|dist/

[tool:pytest]
minversion = 7.0
addopts = -ra -q --cov=core --cov=protocols --cov=ui
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
source = core,protocols,ui,utils
omit = */tests/*,*/__pycache__/*
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
show_missing = True
fail_under = 70

[coverage:html]
directory = htmlcov

[bandit]
exclude_dirs = tests,build,dist
skips = B101,B311

[pylint.messages_control]
disable =
    C0114,  # missing-module-docstring
    C0115,  # missing-class-docstring
    C0116,  # missing-function-docstring
    R0903,  # too-few-public-methods
    R0913,  # too-many-arguments
    W0511,  # fixme

[pylint.format]
max-line-length = 100

[pylint.basic]
good-names = i,j,k,e,f,id,db
