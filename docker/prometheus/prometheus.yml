# =============================================================================
# Prometheus Configuration for Eidolon
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'polyspinor-vault'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Rule files
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    metrics_path: /metrics

  # Vault Application
  - job_name: 'vault-app'
    static_configs:
      - targets: ['vault-app:9090']
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 10s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    metrics_path: /metrics

# Remote write (optional - for long-term storage)
# remote_write:
#   - url: "http://remote-storage:9201/write"
