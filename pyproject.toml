[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poly-spinor-nexus-7d"
description = "Système de vault sécurisé avec cryptographie post-quantique et monitoring blockchain"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.9"
dynamic = ["version"]
authors = [
    {name = "Poly-Spinor Team", email = "contact@polyspinor.io"}
]
keywords = [
    "vault", "cryptocurrency", "nft", "blockchain", "security",
    "post-quantum", "cryptography", "monitoring", "escrow"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Office/Business :: Financial",
]

dependencies = [
    "cryptography>=41.0.0",
    "numpy>=1.24.0",
    "web3>=6.0.0",
    "eth-account>=0.10.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "customtkinter>=5.2.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]
blender = [
    "bpy>=3.6.0",
    "mathutils>=3.3.0",
]
full = [
    "pqcrypto>=0.1.0",
    "aiohttp>=3.8.0",
    "prometheus-client>=0.17.0",
    "redis>=4.6.0",
    "sqlalchemy>=2.0.0",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[project.scripts]
eidolon = "src.ui.launcher:main"
eidolon-api = "src.api.server:run_server"
eidolon-launcher = "src.ui.launcher:main"
eidolond = "src.daemon.cli:main"

[project.gui-scripts]
eidolon-gui = "src.ui.launcher:main"

[project.urls]
Homepage = "https://github.com/polyspinor/nexus-7d"
Documentation = "https://polyspinor.github.io/nexus-7d"
Repository = "https://github.com/polyspinor/nexus-7d.git"
Issues = "https://github.com/polyspinor/nexus-7d/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
    "src",
    "src.daemon",
    "src.daemon.*",
    "src.identity", 
    "src.identity.*",
    "src.api",
    "src.api.*",
    "src.ui",
    "src.ui.*",
    "src.utils",
    "src.utils.*",
    "config",
    "config.*",
]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}

[tool.setuptools.package-data]
config = ["*.json", "*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [".git", "__pycache__", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = [
    "tests/",
    "build/",
    "dist/",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --ignore=tests/_dormant"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning:websockets.legacy",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/__pycache__/*"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
