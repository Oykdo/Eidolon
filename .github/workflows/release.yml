name: Release gate

# A tag `v*` is a release only if the public tree it points at holds up. This
# workflow runs the four public protocol suites on a clean clone and checks
# that the tag, `src/__init__.py` and `CHANGELOG.md` agree. It creates no
# release and builds no binary: the desktop build and the Cipher runtime are
# frozen from the private core, so they are built offline and attached by the
# maintainer (`gh release create`, with SHA256SUMS) — see the README's
# "Releases" section. A red gate means the tag must not be published.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  gate:
    name: Public tree at the tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tag, version and changelog agree
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import re,pathlib; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', pathlib.Path('src/__init__.py').read_text()).group(1))")
          echo "tag $TAG / src/__init__.py $VERSION"
          [ "$TAG" = "$VERSION" ] || { echo "::error::tag v$TAG does not match __version__ $VERSION"; exit 1; }
          grep -qE "^## \[$TAG\] - [0-9]{4}-[0-9]{2}-[0-9]{2}" CHANGELOG.md || { echo "::error::CHANGELOG.md has no dated section for $TAG"; exit 1; }
          echo "CHANGELOG.md has a dated [$TAG] section."

      - name: Install what the protocol suites need
        run: |
          python -m pip install --upgrade pip
          pip install pytest cryptography "pqcrypto>=0.3.4,<1"

      - name: Run the public protocol suites
        env:
          EIDOLON_API_SECRET: "0123456789abcdef0123456789abcdef"
        run: |
          python -m pytest tests/test_ledger_*.py tests/test_eidos_witness_*.py \
                           tests/test_vault_migration.py tests/test_escrow_7d_*.py \
                           -q -o addopts=""

      - name: Vendored wheels are the ones the README names
        run: |
          ls -la prebuilt_wheels/
          sha256sum prebuilt_wheels/*.whl
