[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psnx-sdk"
version = "1.0.0"
description = "Eidolon SDK for Python"
readme = "README.md"
license = {text = "Proprietary"}
authors = [
    {name = "Poly-Spinor Team"}
]
keywords = ["cryptography", "vault", "zkp", "zero-knowledge", "security", "encryption", "web3", "blockchain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.9"
dependencies = [
    "cryptography>=41.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
web3 = [
    "web3>=6.0.0",
    "eth-account>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
all = [
    "psnx-sdk[web3,dev]",
]

[project.urls]
Homepage = "https://github.com/poly-spinor/nexus-7d"
Documentation = "https://docs.poly-spinor.io"
Repository = "https://github.com/poly-spinor/nexus-7d"

[tool.setuptools.packages.find]
where = ["."]
include = ["psnx_sdk*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
