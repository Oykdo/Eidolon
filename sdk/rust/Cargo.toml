[package]
name = "psnx-sdk"
version = "1.0.0"
edition = "2021"
authors = ["Poly-Spinor Team"]
description = "Poly-Spinor Nexus 7D SDK for Rust"
license = "MIT"
repository = "https://github.com/poly-spinor/nexus-7d"
keywords = ["cryptography", "vault", "zkp", "security", "encryption"]
categories = ["cryptography", "authentication"]

[dependencies]
# Crypto
aes-gcm = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
num-bigint = "0.4"
num-traits = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
hex = "0.4"

# HTTP client
reqwest = { version = "0.11", features = ["json"], optional = true }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"], optional = true }

# Error handling
thiserror = "1.0"

[features]
default = ["client"]
client = ["reqwest", "tokio"]

[dev-dependencies]
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "basic"
path = "examples/basic.rs"
